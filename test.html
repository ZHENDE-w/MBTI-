<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>MBTI 黑化人格测试</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 30% 20%, #1a0f0c, #080404 85%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 16px 50px;
      font-family: 'Inter', sans-serif;
    }
    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }
    .card {
      background: rgba(16, 10, 10, 0.72);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 40px;
      padding: 28px 22px 24px;
      border: 1px solid rgba(200, 160, 140, 0.08);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(180, 120, 100, 0.08) inset;
      color: #ede7e0;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: -60%;
      right: -40%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(180, 120, 80, 0.04), transparent 70%);
      pointer-events: none;
      border-radius: 50%;
    }
    .test-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8a756e;
      border-bottom: 1px solid rgba(200, 160, 140, 0.06);
      padding-bottom: 14px;
      margin-bottom: 20px;
      font-weight: 300;
      position: relative;
      z-index: 1;
    }
    .test-header .badge {
      font-size: 16px;
      color: #b88a7a;
      letter-spacing: 0;
    }
    .test-header .qnum {
      background: rgba(180, 120, 100, 0.06);
      padding: 3px 14px;
      border-radius: 30px;
      font-size: 10px;
      color: #bfa69a;
      border: 1px solid rgba(200, 150, 130, 0.05);
      font-weight: 400;
      letter-spacing: 1px;
    }
    .progress-wrap {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      margin-bottom: 28px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #b87a6a, #d4a08c, #b87a6a);
      border-radius: 10px;
      transition: width 0.5s ease;
      box-shadow: 0 0 20px rgba(184, 122, 106, 0.25);
    }
    .question-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 28px;
      color: #f0e6e0;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      min-height: 70px;
      letter-spacing: 0.3px;
      position: relative;
      z-index: 1;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }
    .option {
      background: rgba(40, 28, 26, 0.35);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(200, 170, 155, 0.05);
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 15px;
      line-height: 1.4;
      color: #e0d5ce;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .option:hover {
      background: rgba(70, 48, 40, 0.50);
      border-color: rgba(200, 150, 130, 0.15);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4), 0 0 30px rgba(180, 120, 80, 0.03);
    }
    .option .opt-label {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 26px;
      height: 26px;
      border-radius: 40px;
      background: rgba(180, 130, 110, 0.06);
      color: #b89a8a;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      border: 1px solid rgba(200, 160, 140, 0.04);
      font-family: 'Cormorant Garamond', serif;
    }
    .result-area {
      display: none;
      animation: fadeUp 0.7s ease;
    }
    .result-area.active {
      display: block;
    }
    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .result-hero {
      padding: 8px 0 16px;
      margin-bottom: 14px;
      position: relative;
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding: 0 4px;
    }
    .hero-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #b89a8a;
      font-family: 'Inter', sans-serif;
    }
    .hero-index {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .index-circle {
      position: relative;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(200, 180, 150, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(200, 180, 150, 0.15);
      box-shadow: 0 0 30px rgba(200, 180, 150, 0.03), inset 0 0 30px rgba(200, 180, 150, 0.02);
    }
    .index-circle::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(200, 180, 150, 0.06);
      box-shadow: 0 0 50px rgba(200, 180, 150, 0.02);
      pointer-events: none;
    }
    .index-circle::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      box-shadow: inset 0 0 30px rgba(200, 180, 150, 0.02);
      pointer-events: none;
    }
    .index-circle .num {
      font-family: 'Inter', sans-serif;
      font-size: 34px;
      font-weight: 900;
      color: #ecd6b0;
      line-height: 1;
      letter-spacing: 1px;
      text-shadow: 0 0 40px rgba(200, 180, 150, 0.04);
      font-variant-numeric: tabular-nums;
      position: relative;
      z-index: 1;
    }
    .index-circle .label {
      font-size: 8px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #b89a8a;
      margin-top: 2px;
      font-weight: 400;
      text-shadow: 0 0 20px rgba(200, 180, 150, 0.04);
      position: relative;
      z-index: 1;
    }
    .hero-title-wrap {
      text-align: center;
      padding: 6px 0 4px;
      position: relative;
    }
    .hero-title-wrap::before {
      content: '❋ ✦ ❋';
      position: absolute;
      top: 50%;
      left: 4px;
      transform: translateY(-50%);
      font-size: 11px;
      color: #6a5550;
      letter-spacing: 6px;
      opacity: 0.35;
    }
    .hero-title-wrap::after {
      content: '❋ ✦ ❋';
      position: absolute;
      top: 50%;
      right: 4px;
      transform: translateY(-50%);
      font-size: 11px;
      color: #6a5550;
      letter-spacing: 6px;
      opacity: 0.35;
    }
    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 5px;
      color: #ecd6b0;
      text-shadow: 0 0 60px rgba(200, 180, 150, 0.04), 0 4px 20px rgba(0, 0, 0, 0.3);
      display: inline-block;
      padding: 0 20px;
    }
    .hero-meta {
      text-align: center;
      margin-top: 14px;
    }
    .hero-level {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 400;
      color: #d4c0a8;
      letter-spacing: 5px;
      background: rgba(180, 150, 100, 0.12);
      display: inline-block;
      padding: 3px 20px;
      border-radius: 30px;
      border: 1px solid rgba(180, 150, 100, 0.06);
      box-shadow: 0 0 30px rgba(180, 150, 100, 0.02);
    }
    .hero-brief {
      font-size: 15px;
      color: #b89a8a;
      font-weight: 300;
      letter-spacing: 2px;
      font-style: italic;
      display: block;
      margin-top: 8px;
    }
    .hero-divider {
      text-align: center;
      margin-top: 18px;
    }
    .hero-divider span {
      color: #3d322f;
      font-size: 8px;
      letter-spacing: 12px;
    }
    .chart-wrapper {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 24px;
      padding: 12px 8px 8px;
      margin: 6px 0 18px;
      border: 1px solid rgba(200, 160, 140, 0.04);
      max-width: 100%;
    }
    .chart-wrapper canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      max-height: 220px;
      aspect-ratio: 1/1;
      margin: 0 auto;
    }
    .detail-section {
      margin-top: 6px;
    }
    .detail-block {
      background: rgba(0, 0, 0, 0.10);
      border-radius: 18px;
      padding: 16px 20px;
      margin-bottom: 12px;
      border-left: 2px solid rgba(184, 122, 106, 0.12);
    }
    .detail-block .label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-weight: 600;
      color: #d4b8aa;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 4px;
    }
    .detail-block .content {
      font-size: 15px;
      line-height: 1.7;
      color: #d5cbc4;
      font-weight: 300;
    }
    .footer-note {
      text-align: center;
      font-size: 10px;
      color: #4a3d3a;
      margin-top: 18px;
      letter-spacing: 2px;
      border-top: 1px solid rgba(200, 160, 140, 0.03);
      padding-top: 16px;
      font-weight: 300;
      position: relative;
      z-index: 1;
    }
    .hidden {
      display: none !important;
    }
    @media (max-width: 440px) {
      .card {
        padding: 20px 14px 18px;
        border-radius: 32px;
      }
      .question-text {
        font-size: 19px;
        min-height: 56px;
      }
      .option {
        padding: 12px 14px;
        font-size: 14px;
      }
      .hero-title {
        font-size: 38px;
        letter-spacing: 3px;
      }
      .hero-label {
        font-size: 11px;
        letter-spacing: 3px;
      }
      .index-circle {
        width: 64px;
        height: 64px;
      }
      .index-circle .num {
        font-size: 28px;
      }
      .index-circle .label {
        font-size: 7px;
        letter-spacing: 2px;
      }
      .hero-level {
        font-size: 16px;
        letter-spacing: 4px;
        padding: 2px 16px;
      }
      .hero-brief {
        font-size: 13px;
      }
      .detail-block .content {
        font-size: 14px;
      }
      .chart-wrapper canvas {
        max-height: 180px;
      }
      .result-hero {
        padding: 4px 0 12px;
      }
      .hero-title-wrap::before {
        font-size: 9px;
        letter-spacing: 4px;
        left: 0;
      }
      .hero-title-wrap::after {
        font-size: 9px;
        letter-spacing: 4px;
        right: 0;
      }
      .hero-meta {
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="appCard">

      <div class="test-header">
        <span class="badge">✦</span>
        <span>黑化人格 · 暗影测试</span>
        <span class="qnum" id="qCounter">1 / 51</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div id="questionArea">
        <div class="question-text" id="questionText">加载题目…</div>
        <div class="options" id="optionsContainer"></div>
      </div>

      <div class="result-area" id="resultArea">
        <div class="result-hero">
          <div class="hero-top">
            <span class="hero-label">◈ 你的黑暗原型</span>
            <div class="hero-index">
              <div class="index-circle">
                <span class="num" id="rIndex">76</span>
                <span class="label">觉醒指数</span>
              </div>
            </div>
          </div>
          <div class="hero-title-wrap">
            <span class="hero-title" id="rPrototype">小丑人格</span>
          </div>
          <div class="hero-meta">
            <span class="hero-level" id="rLevel">- 主导期 -</span>
            <span class="hero-brief" id="rBrief">混沌代理人 · 解构一切</span>
          </div>
          <div class="hero-divider">
            <span>✦ ❋ ✦ ❋ ✦</span>
          </div>
        </div>
        <div class="chart-wrapper">
          <canvas id="radarChart"></canvas>
        </div>
        <div class="detail-section" id="detailSection"></div>
      </div>

      <div class="footer-note">✦ 暗黑觉醒 · 仅此一次 ✦</div>
    </div>
  </div>

  <script>
    const MBTI_INITIAL_SCORES = {
      INTJ: [6, 4, -2, 2, 5],
      INTP: [7, -3, -1, -4, 2],
      ENTJ: [5, 6, -4, 7, 4],
      ENTP: [5, -6, -3, 6, 3],
      INFJ: [-4, 5, 6, -5, 4],
      INFP: [-7, -2, 7, -6, 3],
      ENFJ: [-3, 4, 6, 5, 2],
      ENFP: [-5, -5, 4, 6, 3],
      ISTJ: [4, 7, -1, -2, 2],
      ISFJ: [-2, 6, 5, -4, -2],
      ESTJ: [3, 8, -3, 6, 1],
      ESFJ: [-3, 5, 5, 4, -3],
      ISTP: [5, -4, -2, -3, 4],
      ISFP: [-6, -3, 3, -5, 3],
      ESTP: [2, -7, -5, 7, 5],
      ESFP: [-5, -5, -2, 6, 2]
    };
    const MBTI_LIST = Object.keys(MBTI_INITIAL_SCORES);

    const QUESTIONS = [
      { dim: 0, text: '当你面对一个可能影响你人生走向的重大决策时，你通常会？', opts: ['用数据和逻辑冷静分析，做出最优解', '理性分析为主，但也会考虑自己的内心感受', '先考虑自己的直觉和感受，再用理性验证', '完全听从内心的声音，感觉对就对'] },
      { dim: 0, text: '当你和别人发生分歧时，你更倾向于？', opts: ['用事实和逻辑说服对方，直到对方认可', '摆事实讲道理，但也会注意对方的情绪', '先照顾对方的感受，再慢慢讲道理', '感觉不对就不想争了，凭直觉处理'] },
      { dim: 0, text: '当你看到一则让你愤怒的新闻时，你的第一反应是？', opts: ['先去查证信息来源是否可靠，再判断是否相信', '会先判断一下逻辑是否合理，再产生情绪', '会被情绪带动，但事后会去验证真假', '完全被情绪带动，不关心真假'] },
      { dim: 0, text: '你在消费时更看重？', opts: ['性价比、参数、实用性，不看品牌和情绪价值', '功能和价格为主，但也会考虑喜好', '喜欢和感觉为主，但也关注性价比', '完全凭喜好，喜欢就买，不考虑值不值'] },
      { dim: 0, text: '当你需要向别人解释一个复杂问题时，你通常会？', opts: ['按照逻辑框架，一步一步拆解给对方听', '逻辑为主，但会根据对方的反应调整表达方式', '先用故事或比喻让对方有兴趣，再讲逻辑', '怎么有趣怎么来，重点是好懂，不追求逻辑完整'] },
      { dim: 0, text: '当你回顾过去一年自己的成长时，你更关注？', opts: ['我具体完成了哪些目标、取得了哪些可量化的成果', '既看结果，也看我过程中感受的变化', '我经历了什么、感受到了什么、有什么新的体验', '我有没有变得更幸福、更自由，不看具体结果'] },
      { dim: 0, text: '当有人向你求助，你需要判断是否应该帮他时，你更倾向于？', opts: ['先判断他是不是真的需要帮助，以及帮他的成本是多少', '理性评估后，如果力所能及就帮', '感性上觉得应该帮，但也会衡量一下利弊', '感性上觉得应该帮，不计成本地帮'] },
      { dim: 0, text: '你在观看一部电影或小说时，更常被什么打动？', opts: ['精巧的剧情结构、逻辑闭环、伏笔回收', '既有合理的剧情，也有打动人的情感', '人物的情感和命运，故事本身不重要', '纯粹是情感冲击，哭过笑过就好'] },
      { dim: 0, text: '你在评价一个人时，更看重？', opts: ['他的能力和成就，是否靠谱', '能力和人品都看重', '他的善良和真诚', '和他在一起是否舒服、开心'] },
      { dim: 0, text: '当你自己处于情绪低谷时，你通常会？', opts: ['理性分析自己为什么低落，找方法解决', '给自己一点时间消化，再用理性梳理', '允许自己完全沉浸在情绪里，不急着走出来', '放任自己低落，等它自己过去'] },
      { dim: 1, text: '当遇到一条你觉得很不合理的规则时，你的第一反应通常是？', opts: ['遵守规则，但尝试通过正式渠道推动修改', '在规则允许的范围内，寻找变通的办法', '在没有风险的情况下，偶尔绕开规则', '直接无视规则，按自己的方式去做'] },
      { dim: 1, text: '你更喜欢哪种工作或生活方式？', opts: ['有清晰的流程、明确的时间表和固定的节奏', '有大致框架，细节可以灵活调整', '自由度高，只有大的方向，没有细节约束', '完全自由，想到哪做到哪，没有任何计划'] },
      { dim: 1, text: '当你进入一个全新的环境（如入职新公司、搬新家），你通常会？', opts: ['先搞清楚所有规则和流程，然后严格执行', '了解主要规则，其他的边做边学', '只了解必要的规则，其余按自己习惯来', '不关心规则，先按自己的方式行动起来再说'] },
      { dim: 1, text: '你对“计划”的态度是？', opts: ['凡事预则立，不预则废，我必须有详细计划', '有计划，但也给意外留出弹性空间', '有大致方向就行，细节边走边看', '从不做计划，计划赶不上变化'] },
      { dim: 1, text: '当你发现身边的人不守规矩时，你的感受是？', opts: ['非常反感，规则就是为了公平而存在的', '不太舒服，但如果没影响到我，可以接受', '无所谓，只要不损害我的利益就好', '欣赏这种人，敢打破规则才是有勇气'] },
      { dim: 1, text: '你喜欢什么样的团队协作方式？', opts: ['每个人各司其职，有清晰的流程和标准', '有流程，但也允许一定程度的自由发挥', '灵活协作，不设固定流程，看情况分工', '完全自组织，大家按兴趣和能力自由搭配'] },
      { dim: 1, text: '你对“突发事件打乱你的计划”的反应是？', opts: ['非常焦虑，会立刻重新制定新的计划恢复秩序', '有点烦躁，但会尽快调整适应', '能接受，觉得这就是生活的一部分', '无所谓，甚至享受这种意外带来的新鲜感'] },

              '你已经不再被动顺从了。你开始主动进入那些对你有用的系统——职场、社群、圈子——然后用你的“人畜无害”形象获取信任、获取信息、获取资源。没有人怀疑你，因为你实在是太“好”了。',

              '你开始觉得自己“比那些激进的人聪明”，你开始对那些表达愤怒的人感到轻蔑。你觉得自己是更高阶的反抗者——但你其实已经离系统太近了。',
              '你的长线思维是稀缺品质，但请警惕“温水煮青蛙”——你可能不是在煮别人，而是在煮自己。定期给自己一个“跳出系统”的视角，问问自己：“如果我只是一个旁观者，我会赞成现在的做法吗？”'

          { name: '微笑寄生体', brief: '完美的伪装', radar: [28, 68, 80, 18, 62], sections: [
              '你已经完全融入了系统，但你不是系统的一部分——你是系统里的一颗肿瘤。你不会被检测到，因为你看起来和正常组织一模一样。你在里面汲取营养、缓慢生长，直到系统在某个时刻失灵，而你早已在新的宿主身上继续微笑。',
              '你已经无法“做自己”了。因为你已经忘记了自己是谁。你所有的表达都是“策略”，所有的关系都是“工具”，你甚至开始对自己的家人计算“投入产出比”了。',
              '你目前的处境非常危险，因为从外面看你是最“正常”的——这就是最危险的部分。请你一定要找一个不涉及任何利害关系的人，进行一种“绝对诚实”的表达。哪怕只能在一次谈话中摘下面具，那也会是你重新拥有真实面孔的开始。'

      ]
    };

    const PROTOTYPE_CODES = {
      '灭霸': [0, 0, 2, 0, 0],
      '小丑': [0, 1, 2, 0, 0],
      '汉尼拔': [0, 0, 2, 1, 1],
      '黑天鹅': [1, 0, 1, 1, 0],
      '教父': [0, 0, 1, 0, 1],
      '寄生虫': [1, 1, 2, 1, 1],
      '麦克白': [1, 0, 2, 0, 0],
      '机械姬': [1, 1, 1, 0, 1],
      '老大哥': [0, 0, 2, 1, 0],
      '毒蛇': [0, 1, 2, 1, 0],
      '盖茨比': [1, 0, 1, 0, 0],
      '白鸽': [1, 0, 1, 1, 0]
    };
    const PROTOTYPE_NAMES = Object.keys(PROTOTYPE_CODES);
    const DIM_NAMES = ['理性', '规则', '利他', '显性', '稳定'];

    let state = { mbti: null, answers: [], currentQuestion: 0, totalQuestions: 51, phase: 'mbti' };

    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const questionArea = document.getElementById('questionArea');
    const resultArea = document.getElementById('resultArea');
    const progressBar = document.getElementById('progressBar');
    const qCounter = document.getElementById('qCounter');
    const rPrototype = document.getElementById('rPrototype');
    const rLevel = document.getElementById('rLevel');
    const rBrief = document.getElementById('rBrief');
    const rIndex = document.getElementById('rIndex');
    const detailSection = document.getElementById('detailSection');
    let chartInstance = null;

    function renderMBTI() {
      questionText.textContent = '请选择你的MBTI类型（这将作为你的初始人格底色）';
      optionsContainer.innerHTML = '';
      MBTI_LIST.forEach(mbti => {
        const div = document.createElement('div');
        div.className = 'option';
        const label = document.createElement('span');
        label.className = 'opt-label';
        label.textContent = mbti;
        const text = document.createElement('span');
        text.textContent = mbti;
        div.appendChild(label);
        div.appendChild(text);
        div.addEventListener('click', () => {
          state.mbti = mbti;
          state.currentQuestion = 0;
          state.phase = 'questions';
          renderQuestion(0);
        });
        optionsContainer.appendChild(div);
      });
      qCounter.textContent = '1 / 51';
      progressBar.style.width = '0%';
    }

    function renderQuestion(index) {
      if (index >= QUESTIONS.length) { computeResult(); return; }
      const q = QUESTIONS[index];
      questionText.textContent = q.text;
      optionsContainer.innerHTML = '';
      const labels = ['A', 'B', 'C', 'D'];
      const scores = [2, 1, -1, -2];
      q.opts.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        const label = document.createElement('span');
        label.className = 'opt-label';
        label.textContent = labels[i];
        const text = document.createElement('span');
        text.textContent = opt;
        div.appendChild(label);
        div.appendChild(text);
        div.addEventListener('click', () => {
          state.answers[index] = scores[i];
          renderQuestion(index + 1);
        });
        optionsContainer.appendChild(div);
      });
      qCounter.textContent = (index + 2) + ' / 51';
      const pct = ((index + 1) / QUESTIONS.length) * 100;
      progressBar.style.width = Math.min(pct, 100) + '%';
    }

    function computeResult() {
      const init = MBTI_INITIAL_SCORES[state.mbti] || [0, 0, 0, 0, 0];
      const dimScores = [0, 0, 0, 0, 0];
      for (let i = 0; i < QUESTIONS.length; i++) {
        const dim = QUESTIONS[i].dim;
        const score = state.answers[i] || 0;
        dimScores[dim] += score;
      }
      const finalScores = dimScores.map((v, i) => v + init[i]);
      const code = finalScores.map(v => v >= 0 ? 0 : 1);
      let matchedProto = '小丑';
      let minDist = Infinity;
      for (const [name, c] of Object.entries(PROTOTYPE_CODES)) {
        let dist = 0;
        for (let i = 0; i < 5; i++) dist += (code[i] !== c[i]) ? 1 : 0;
        if (dist < minDist) { minDist = dist;
          matchedProto = name; }
      }
      const protoIdx = PROTOTYPE_NAMES.indexOf(matchedProto);
      const totalScore = finalScores.reduce((a, b) => a + b, 0);
      const raw = totalScore + 40;
      const idx = Math.min(3, Math.max(0, Math.floor(raw / 20)));
      const levelData = RESULTS.levels[protoIdx][idx];
      const indexVal = Math.min(100, Math.max(20, Math.round(raw * 1.2 + 10)));
      showResult(matchedProto, levelData, indexVal, finalScores);
    }

    function showResult(prototype, level, index, scores) {
      questionArea.classList.add('hidden');
      resultArea.classList.add('active');
      rPrototype.textContent = prototype + '人格';
      rLevel.textContent = '- ' + level.name + ' -';
      rBrief.textContent = level.brief;
      rIndex.textContent = index;
      detailSection.innerHTML = '';
      const labels = ['✦ 黑化特征', '✦ 危险信号', '✦ 使用指南'];
      level.sections.forEach((text, i) => {
        const block = document.createElement('div');
        block.className = 'detail-block';
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = labels[i] || '✦ 解析';
        const content = document.createElement('div');
        content.className = 'content';
        content.textContent = text;
        block.appendChild(label);
        block.appendChild(content);
        detailSection.appendChild(block);
      });
      qCounter.textContent = '✦ 觉醒 ✦';
      progressBar.style.width = '100%';
      const canvas = document.getElementById('radarChart');
      const ctx = canvas.getContext('2d');
      if (chartInstance) { chartInstance.destroy();
        chartInstance = null; }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const radarData = level.radar || [50, 50, 50, 50, 50];
      chartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: DIM_NAMES,
          datasets: [{
            label: '黑化维度倾向',
            data: radarData,
            backgroundColor: 'rgba(180, 120, 100, 0.06)',
            borderColor: '#b87a6a',
            borderWidth: 2,
            pointBackgroundColor: '#d4a08c',
            pointBorderColor: '#1a0f0c',
            pointBorderWidth: 1.5,
            pointRadius: 4,
            fill: true,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: { legend: { display: false } },
          scales: {
            r: {
              min: 0,
              max: 100,
              ticks: { stepSize: 25, color: '#5a4a44', backdropColor: 'transparent', font: { size: 8 } },
              pointLabels: { color: '#c9b0a6', font: { size: 12, family: 'Cormorant Garamond', weight: '600' } },
              grid: { color: 'rgba(200, 160, 140, 0.04)', circular: true },
              angleLines: { color: 'rgba(200, 160, 140, 0.04)' }
            }
          }
        }
      });
      chartInstance.update();
    }

    function init() {
      state.answers = new Array(QUESTIONS.length).fill(0);
      state.currentQuestion = 0;
      state.phase = 'mbti';
      resultArea.classList.remove('active');
      questionArea.classList.remove('hidden');
      renderMBTI();
    }
    init();
  </script>
